# Tiny Tapeout project information
project:
  title:        "UMARV sensor fusion"      # Project title
  author:       "cheerfulconnor78"      # Your name
  discord:      ""      # Your discord username, for communication and automatically assigning you a Tapeout role (optional)
  description:  "Time-synchronised sensor front end for a ground robot: VN-300 and dead-wheel encoder"      # One line description of what your project does
  language:     "SystemVerilog" # other examples include SystemVerilog, Amaranth, VHDL, etc
  clock_hz:     50000000       # Clock frequency in Hz (or 0 if not applicable)

  # How many tiles your design occupies? A single tile is about 167x108 uM.
  tiles: "8x4"          # Valid values: 1x1, 1x2, 2x2, 3x2, 4x2, 6x2 or 8x2

  # Your top module name must start with "tt_um_". Make it unique by including your github username:
  top_module:  "tt_um_umigv_sensorfusion"

  # List your project's source files here.
  # Source files must be in ./src and you must list each source file separately, one per line.
  # Don't forget to also update `PROJECT_SOURCES` in test/Makefile.
  source_files:
    - "timestamper.sv"
    - "v16PacketParser.v"
    - "lidar_vlp16_rx.sv"
    - "lidar_cordic.sv"
    - "mii_recv.sv"
    - "mii_send.sv"
    - "async_fifo.sv"
    - "reset_release.sv"
    - "lidar_laser_table.sv"
    - "lidar_motion.sv"
    - "lidar_latch_mem.sv"
    - "lidar_point_buffer.sv"
    - "lidar_xyz.sv"
    - "lidar_frame_tx.sv"
    - "lidar_top.sv"
    - "spi_regs.sv"
    - "fp_serial.sv"
    - "ukf_tables.sv"
    - "ukf_top.sv"
    - "tt_um_umigv_sensorfusion.sv"

# The pinout of your project. Leave unused pins blank. DO NOT delete or add any pins.
# This section is for the datasheet/website. Use descriptive names (e.g., RX, TX, MOSI, SCL, SEG_A, etc.).
pinout:
  # Inputs
  ui[0]: "VN-300 serial data (vn_rx)"
  ui[1]: "Encoder SPI MISO"
  ui[2]: "Enable (1 = run)"
  ui[3]: "Lidar MII RX_DV"
  ui[4]: "Trial settings data"
  ui[5]: "Trial settings shift enable"
  ui[6]: "Host MII TX_CLK"
  ui[7]: "Lidar MII RX_CLK"

  # Outputs
  uo[0]: "VN-300 SyncIn pulse"
  uo[1]: "Encoder SPI CS_N"
  uo[2]: "Encoder SPI SCK"
  uo[3]: "Encoder SPI MOSI"
  uo[4]: "Measurements ready pulse"
  uo[5]: "Debug stream data"
  uo[6]: "Debug stream frame"
  uo[7]: "Host MII TX_EN"

  # Bidirectional pins
  uio[0]: "Lidar MII RXD[0]"
  uio[1]: "Lidar MII RXD[1]"
  uio[2]: "Lidar MII RXD[2]"
  uio[3]: "Lidar MII RXD[3]"
  uio[4]: "Host MII TXD[0]"
  uio[5]: "Host MII TXD[1]"
  uio[6]: "Host MII TXD[2]"
  uio[7]: "Host MII TXD[3]"

# Do not change!
yaml_version: 6
