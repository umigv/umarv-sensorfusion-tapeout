name: show-layout

# One-off: publish the layout of an already finished trial build (run 45515197853,
# trial/r2-wl15-h05g) to the repository's GitHub Pages viewer, without building it again.
on:
  push:

jobs:
  viewer:
    runs-on: ubuntu-24.04
    permissions:
      actions: read
      pages: write
      id-token: write
    steps:
      - name: Download GDS artifact
        uses: actions/download-artifact@v7
        with:
          name: tt_submission
          run-id: 45515197853
          github-token: ${{ github.token }}

      - name: Read PDK information from submission
        working-directory: tt_submission
        run: |
          PDK=$(jq -r '.PDK' pdk.json)
          echo "PDK=$PDK" >> $GITHUB_ENV

      - name: Download gds_render (png) artifact
        uses: actions/download-artifact@v7
        with:
          name: gds_render
          path: gh-pages
          run-id: 45515197853
          github-token: ${{ github.token }}

      - name: Copy OAS And GDSII
        run: |
          cp tt_submission/*.gds gh-pages/tinytapeout.gds
          cp tt_submission/*.oas gh-pages/tinytapeout.oas

      - name: Generate an HTML page that redirects to viewer
        run: |
          cat << EOF >> gh-pages/index.html
            <!DOCTYPE html>
            <html lang="en">
            <head>
              <meta charset="UTF-8">
              <title>Redirecting to 3D Viewer...</title>
            </head>
            <body>
              <script>
                location.href = "https://gds-viewer.tinytapeout.com/?pdk=${{ env.PDK }}&model=" + encodeURIComponent(location.href + '/tinytapeout.oas');
              </script>
            </body>
            </html>
          EOF

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v5
        with:
          path: 'gh-pages'
          name: github-pages-${{ github.run_attempt }}

      - name: Wait for the artifact to be listed
        run: sleep 30

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
        with:
          artifact_name: github-pages-${{ github.run_attempt }}

      - name: Show the address
        run: echo "${{ steps.deployment.outputs.page_url }}"
