name: gds

on:
  push:
    branches-ignore:
      - 'results/**'
  workflow_dispatch:

concurrency:
  group: gds-${{ github.ref }}
  cancel-in-progress: true

jobs:
  gds:
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - name: checkout repo
        uses: actions/checkout@v6
        with:
          submodules: recursive

      - name: Build GDS
        uses: TinyTapeout/tt-gds-action@ttsky26d
        timeout-minutes: 75
        with:
          pdk: sky130A

      # Trial branches only: save the key numbers of the run where they can be read with git.
      - name: Publish metrics
        if: always()
        run: |
          OUT=/tmp/metrics.txt
          {
            echo "branch $GITHUB_REF_NAME  commit $GITHUB_SHA  $(date -u +%FT%TZ)"
            echo "=== steps reached"
            ls runs/wokwi 2>/dev/null | tail -70
            echo "=== key lines"
            grep -rhsE "Utilization:|Movable instances area|Core area|Design area|hold buffers|Inserted [0-9]+ buffers|Resized [0-9]+ instances|Number of violations =|Completing 100%|Total wirelength|Routed nets|Number of instances:|Number of nets:|Number of pins:|worst slack|tns |wns |Chip area|Number of cells:|DPL-0036|GPL-0302|GRT-0115|\[ERROR" runs/wokwi --include='*.log' | cut -c1-200 | tail -400
            echo "=== cell type reports (last of each step)"
            for f in $(grep -rlsE "Cell type report" runs/wokwi --include='*.log' | sort); do echo "--- $f"; grep -A14 "Cell type report" "$f" | tail -15 | cut -c1-120; done
            echo "=== congestion reports"
            for f in $(grep -rlsE "Final congestion report" runs/wokwi --include='*.log' | sort); do echo "--- $f"; grep -A14 "Final congestion report" "$f" | tail -15 | cut -c1-140; done
            echo "=== violation tables"
            for f in $(grep -rlsE "Viol/Layer" runs/wokwi --include='*.log' | sort); do echo "--- $f"; grep -A8 "Viol/Layer" "$f" | head -30 | cut -c1-140; done
            echo "=== yosys stat"
            for f in $(grep -rlsE "Chip area for" runs/wokwi --include='*.log' --include='*.rpt' | sort | tail -2); do echo "--- $f"; grep -B60 "Chip area for" "$f" | tail -75 | cut -c1-120; done
            echo "=== flow log tail"
            tail -60 runs/wokwi/flow.log 2>/dev/null | cut -c1-220
            echo "=== warnings and errors summary"
            tail -40 runs/wokwi/warning.log 2>/dev/null | cut -c1-220
            tail -40 runs/wokwi/error.log 2>/dev/null | cut -c1-220
          } > $OUT 2>&1 || true
          wc -c $OUT
          rm -rf /tmp/res && mkdir /tmp/res && cd /tmp/res && git init -q && cp $OUT metrics.txt
          git -c user.name=trial -c user.email=trial@users.noreply.github.com add metrics.txt
          git -c user.name=trial -c user.email=trial@users.noreply.github.com commit -q -m "metrics for $GITHUB_REF_NAME $GITHUB_SHA"
          git push -f "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}.git" "HEAD:refs/heads/results/${GITHUB_REF_NAME#trial/}"

  precheck:
    needs: gds
    runs-on: ubuntu-24.04
    steps:
      - name: Run Tiny Tapeout Precheck
        uses: TinyTapeout/tt-gds-action/precheck@ttsky26d

  gl_test:
    needs: gds
    runs-on: ubuntu-24.04
    steps:
      - name: checkout repo
        uses: actions/checkout@v6
        with:
          submodules: recursive

      - name: GL test
        uses: TinyTapeout/tt-gds-action/gl_test@ttsky26d

  viewer:
    needs: gds
    runs-on: ubuntu-24.04
    permissions:
      pages: write      # to deploy to Pages
      id-token: write   # to verify the deployment originates from an appropriate source
    steps:
      - uses: TinyTapeout/tt-gds-action/viewer@ttsky26d
