name: gds

# TRIAL ONLY: no build. Takes the finished layout of another trial run and runs the Tiny Tapeout
# precheck on it several times, with and without extra swap space, to find out why the precheck
# runner drops out. A memory log is published to a results/ branch every two minutes.
on:
  push:
    branches-ignore:
      - 'results/**'
  workflow_dispatch:

concurrency:
  group: gds-${{ github.ref }}
  cancel-in-progress: true

jobs:
  gds:
    runs-on: ubuntu-24.04
    permissions:
      actions: read
    steps:
      - name: Fetch the layout of the build under test
        uses: actions/download-artifact@v7
        with:
          name: tt_submission
          path: tt_submission
          run-id: 45766729782
          github-token: ${{ github.token }}
      - name: Hand it to the jobs below
        uses: actions/upload-artifact@v7
        with:
          name: tt_submission
          path: tt_submission

  plain_a:
    needs: gds
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - name: Memory log
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          true
          B=results/${GITHUB_REF_NAME#trial/}-plain_a
          mkdir -p /tmp/memlog && cd /tmp/memlog && git init -q && git checkout -q -b pub
          git config user.name "github-actions[bot]"; git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git remote add origin "https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git"
          nohup bash -c 'while :; do { date -u +%H:%M:%S; free -m | sed -n 2,3p; ps -eo rss,etimes,comm --sort=-rss | head -6; echo; } >> mem.txt; sleep 20; done' >/dev/null 2>&1 &
          nohup bash -c "while :; do sleep 120; git add mem.txt; git commit -qm mem; git push -q -f origin pub:$B; done" >/dev/null 2>&1 &
          nproc; free -m
      - name: Run Tiny Tapeout Precheck
        uses: TinyTapeout/tt-gds-action/precheck@ttsky26d
      - name: Final memory log
        if: always()
        shell: bash
        run: |
          cd /tmp/memlog && echo "=== precheck step ended: ${{ job.status }}" >> mem.txt && git add mem.txt && git commit -qm mem && git push -q -f origin pub:results/${GITHUB_REF_NAME#trial/}-plain_a

  plain_b:
    needs: gds
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - name: Memory log
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          true
          B=results/${GITHUB_REF_NAME#trial/}-plain_b
          mkdir -p /tmp/memlog && cd /tmp/memlog && git init -q && git checkout -q -b pub
          git config user.name "github-actions[bot]"; git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git remote add origin "https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git"
          nohup bash -c 'while :; do { date -u +%H:%M:%S; free -m | sed -n 2,3p; ps -eo rss,etimes,comm --sort=-rss | head -6; echo; } >> mem.txt; sleep 20; done' >/dev/null 2>&1 &
          nohup bash -c "while :; do sleep 120; git add mem.txt; git commit -qm mem; git push -q -f origin pub:$B; done" >/dev/null 2>&1 &
          nproc; free -m
      - name: Run Tiny Tapeout Precheck
        uses: TinyTapeout/tt-gds-action/precheck@ttsky26d
      - name: Final memory log
        if: always()
        shell: bash
        run: |
          cd /tmp/memlog && echo "=== precheck step ended: ${{ job.status }}" >> mem.txt && git add mem.txt && git commit -qm mem && git push -q -f origin pub:results/${GITHUB_REF_NAME#trial/}-plain_b

  swap_a:
    needs: gds
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - name: Memory log
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          sudo swapoff -a || true; sudo fallocate -l 24G /mnt/swap_extra && sudo chmod 600 /mnt/swap_extra && sudo mkswap /mnt/swap_extra && sudo swapon /mnt/swap_extra
          B=results/${GITHUB_REF_NAME#trial/}-swap_a
          mkdir -p /tmp/memlog && cd /tmp/memlog && git init -q && git checkout -q -b pub
          git config user.name "github-actions[bot]"; git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git remote add origin "https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git"
          nohup bash -c 'while :; do { date -u +%H:%M:%S; free -m | sed -n 2,3p; ps -eo rss,etimes,comm --sort=-rss | head -6; echo; } >> mem.txt; sleep 20; done' >/dev/null 2>&1 &
          nohup bash -c "while :; do sleep 120; git add mem.txt; git commit -qm mem; git push -q -f origin pub:$B; done" >/dev/null 2>&1 &
          nproc; free -m
      - name: Run Tiny Tapeout Precheck
        uses: TinyTapeout/tt-gds-action/precheck@ttsky26d
      - name: Final memory log
        if: always()
        shell: bash
        run: |
          cd /tmp/memlog && echo "=== precheck step ended: ${{ job.status }}" >> mem.txt && git add mem.txt && git commit -qm mem && git push -q -f origin pub:results/${GITHUB_REF_NAME#trial/}-swap_a

  swap_b:
    needs: gds
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - name: Memory log
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          sudo swapoff -a || true; sudo fallocate -l 24G /mnt/swap_extra && sudo chmod 600 /mnt/swap_extra && sudo mkswap /mnt/swap_extra && sudo swapon /mnt/swap_extra
          B=results/${GITHUB_REF_NAME#trial/}-swap_b
          mkdir -p /tmp/memlog && cd /tmp/memlog && git init -q && git checkout -q -b pub
          git config user.name "github-actions[bot]"; git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git remote add origin "https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git"
          nohup bash -c 'while :; do { date -u +%H:%M:%S; free -m | sed -n 2,3p; ps -eo rss,etimes,comm --sort=-rss | head -6; echo; } >> mem.txt; sleep 20; done' >/dev/null 2>&1 &
          nohup bash -c "while :; do sleep 120; git add mem.txt; git commit -qm mem; git push -q -f origin pub:$B; done" >/dev/null 2>&1 &
          nproc; free -m
      - name: Run Tiny Tapeout Precheck
        uses: TinyTapeout/tt-gds-action/precheck@ttsky26d
      - name: Final memory log
        if: always()
        shell: bash
        run: |
          cd /tmp/memlog && echo "=== precheck step ended: ${{ job.status }}" >> mem.txt && git add mem.txt && git commit -qm mem && git push -q -f origin pub:results/${GITHUB_REF_NAME#trial/}-swap_b
