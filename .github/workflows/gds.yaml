name: gds

on:
  push:
    branches-ignore:
      - 'results/**'

concurrency:
  group: gds-${{ github.ref }}
  cancel-in-progress: true

jobs:
  gds:
    runs-on: ubuntu-24.04
    steps:
      - name: Stopped
        run: echo "This trial build was stopped once its result was known. The previous commit on this branch is the design that was built."
